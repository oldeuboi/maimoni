name: Update ETF prices

on:
  schedule:
    # 06:00, 12:00 and 18:00 UTC on weekdays (market days)
    - cron: '0 6,12,18 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch prices
        run: python update_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "price-bot"
          git config user.email "actions@github.com"
          git add prices.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ETF prices"
            git push
          else
            echo "No price changes"
          fi
